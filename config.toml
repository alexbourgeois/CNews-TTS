[capture]
video_id = "x3b68jn"          # Live CNEWS (secours : "x5idxxp")
format = "bestaudio/worst"    # audio seul si dispo, sinon la variante la plus légère
segment_minutes = 1           # fichiers courts : texte disponible ~1-2 min après la diffusion
stall_timeout_s = 120
drift_tolerance_s = 30        # en temps normal le flux devance l'horloge d'environ 7 s

[paths]
data_dir = "data"

[transcribe]
model = "large-v3"
device = "cuda"
compute_type = "float16"
language = "fr"
timezone = "Europe/Paris"
hallucination_blacklist = [
  "Sous-titrage ST' 501",
  "Sous-titres réalisés par la communauté d'Amara.org",
  "Sous-titrage Société Radio-Canada",
  "Merci d'avoir regardé cette vidéo",
]

[alert]
# Son joué par « follow --alert » quand un de ces mots est prononcé (accents et majuscules ignorés).
# Un mot seul couvre tous les mots qui commencent par lui (« immigr » : immigration, immigrés…) ;
# une expression doit apparaître telle quelle.
keywords = [
  "Marine", "Le pen", "immigr", "émigr", "migr", "remigr", "clandestin", "sans-papiers", "étranger",
  "réfugié", "asile", "OQTF", "regroupement familial", "titre de séjour",
  "naturalisation", "frontière", "expulsion", "passeur", "Frontex", "Lampedusa",
  "aide médicale d'État",
]

[live]
# Modèle de la commande « live » : plus rapide que large-v3, pour quelques secondes de retard seulement.
model = "large-v3-turbo"
