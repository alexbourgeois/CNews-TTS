<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mots du direct</title>
<style>
  :root { --bg: #12141a; --panel: #1d2029; --text: #eceef3; --muted: #8a90a0; --red: #ff4b4b; --green: #2fd462; --orange: #ffad33; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 20px; }
  input { width: 100%; padding: 14px 16px; font-size: 22px; border-radius: 12px; border: 2px solid #343947;
          background: var(--panel); color: var(--text); outline: none; transition: border-color .15s; }
  input:focus { border-color: #5b6478; }
  input.hit-rouge { border-color: var(--red); } input.hit-vert { border-color: var(--green); }
  input.hit-neutre { border-color: #9aa3b8; } input.miss { border-color: var(--orange); }
  button { margin-top: 12px; width: 100%; padding: 14px; font-size: 18px; font-weight: 600; border: 0;
           border-radius: 12px; background: #3b82f6; color: white; cursor: pointer; }
  .hidden { display: none; }
  .me { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 8px; }
  .me b { font-size: 20px; }
  .bar { height: 18px; border-radius: 9px; background: #2a2e3a; overflow: hidden; margin-bottom: 16px; }
  .bar div { height: 100%; width: 100%; background: var(--green); transition: width .3s, background .3s; }
  #feedback { min-height: 24px; margin: 10px 2px 18px; color: var(--muted); }
  #feedback.rouge { color: var(--red); } #feedback.vert { color: var(--green); } #feedback.ko { color: var(--orange); }
  #ko { text-align: center; font-size: 20px; font-weight: 700; color: var(--orange); margin-bottom: 12px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-bottom: 1px solid #262a35; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.self td { color: #9cc3ff; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; color: var(--muted); font-size: 14px; }
  li { padding: 3px 0; }
  .stats { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <section id="join">
    <h1>Mots du direct</h1>
    <p class="hint">Regardez l'écran et tapez les mots qui tombent pour les effacer. Rouge : il explose sur les
      autres joueurs. Vert : il vous soigne.</p>
    <form id="join-form">
      <input id="name" maxlength="20" placeholder="Votre nom" autocomplete="off" required>
      <button>Jouer</button>
    </form>
  </section>

  <section id="play" class="hidden">
    <div class="me"><b id="me-name"></b><span><span id="me-hp">100</span> PV · <span id="me-score">0</span> pts</span></div>
    <div class="bar"><div id="me-bar"></div></div>
    <div id="ko" class="hidden"></div>
    <input id="word" placeholder="Tapez un mot puis Entrée ou espace" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <div id="feedback"></div>
    <h2>Joueurs</h2>
    <table id="players"></table>
    <p class="stats" id="stats"></p>
    <h2>Dernières actions</h2>
    <ul id="events"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let me = null;

function remembered() { try { return localStorage.getItem("joueur") || ""; } catch { return ""; } }
function remember(name) { try { localStorage.setItem("joueur", name); } catch {} }

async function api(path, data) {
  const options = data ? { method: "POST", body: JSON.stringify(data) } : {};
  const response = await fetch(path, options);
  return response.json();
}

$("name").value = remembered();
$("join-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const result = await api("/api/join", { name: $("name").value });
  if (!result.name) return;
  me = result.name;
  remember(me);
  $("me-name").textContent = me;
  $("join").classList.add("hidden");
  $("play").classList.remove("hidden");
  $("word").focus();
  refresh();
  setInterval(refresh, 500);
});

async function send(word) {
  word = word.trim();
  if (!word) return;
  const result = await api("/api/type", { name: me, word });
  const input = $("word");
  input.className = result.ok ? "hit-" + result.kind : "miss";
  setTimeout(() => (input.className = ""), 350);
  $("feedback").className = result.kind;
  $("feedback").textContent = result.message;
  refresh();
}

$("word").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); send(event.target.value); event.target.value = ""; }
});
$("word").addEventListener("input", (event) => {
  const value = event.target.value;
  if (value.endsWith(" ")) { send(value); event.target.value = ""; }
});

async function refresh() {
  let state;
  try { state = await api("/api/state?name=" + encodeURIComponent(me)); } catch { return; }
  const mine = state.me || { hp: 100, score: 0, ko: 0 };
  $("me-hp").textContent = mine.hp;
  $("me-score").textContent = mine.score;
  const bar = $("me-bar");
  bar.style.width = mine.hp + "%";
  bar.style.background = mine.hp > 50 ? "var(--green)" : mine.hp > 25 ? "var(--orange)" : "var(--red)";
  $("ko").classList.toggle("hidden", !mine.ko);
  $("ko").textContent = "KO ! Retour dans " + mine.ko + " s";
  const wasKo = $("word").disabled;
  $("word").disabled = mine.ko > 0;
  if (wasKo && !$("word").disabled) $("word").focus();  // de retour après un KO

  const rows = state.players.map((p) => {
    const tr = document.createElement("tr");
    if (p.name === me) tr.className = "self";
    const cells = [p.name, p.ko ? "KO " + p.ko + " s" : p.hp + " PV", p.score + " pts"];
    cells.forEach((text, i) => {
      const td = document.createElement("td");
      td.textContent = text;
      if (i) td.className = "num";
      tr.appendChild(td);
    });
    return tr;
  });
  $("players").replaceChildren(...rows);
  $("stats").textContent = state.words + " mot(s) à l'écran · " + state.missed + " raté(s)";
  $("events").replaceChildren(...state.events.map((text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  }));
}
</script>
</body>
</html>
