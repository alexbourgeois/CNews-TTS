[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnews-tts"
version = "0.1.0"
description = "Capture continue du direct CNews et transcription avec faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[curl-cffi]",
    "faster-whisper",
    "piper-tts",  # voix neuronale française pour live --speak
    "sounddevice",
    "spacy>=3.8,<3.9",  # live --condense : nature des mots et infinitifs
    "fr_core_news_md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
    "av<19",  # faster-whisper 1.2.1 passe metadata_errors à av.open, supprimé dans PyAV 19
    "tzdata",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
