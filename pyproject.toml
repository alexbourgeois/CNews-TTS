[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnews-tts"
version = "0.1.0"
description = "Capture continue du direct CNews et transcription avec faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[curl-cffi]",
    "faster-whisper",
    "tzdata",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
